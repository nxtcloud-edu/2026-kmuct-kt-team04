version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 24
        - nvm use 24
        - npm install
        - npm run check:backend
        - npm test
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # Amplify 환경 변수(VITE_ 접두) 중 Vite가 빌드 시점에 인라인해야 하는 값을 .env로 주입
        - env | grep -e '^VITE_' >> .env.production || true
    build:
      commands:
        - nvm use 24
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
